# Build the web app as a static SPA and publish it to GitHub Pages.
# One-time repo setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# See `PAGES_BASE_PATH` in apps/web/vite.config.ts for what the Pages build mode changes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `engines.node` >= 22.18 (vite/vitest run on node even when launched via bun).
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Bun version comes from the root package.json `packageManager` field.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile

      # `base_path` is `/<repo>` for a project page, empty for a user/org page or custom domain.
      - name: Build
        working-directory: apps/web
        run: bun run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # The SPA build prerenders one shell (`_shell.html`). Serve it as the site root, and as
      # `404.html` — Pages' fallback for any path without a file — so deep links
      # (`/inventory/armaments`, `/share?d=…`) boot the client router. `.nojekyll` stops
      # Pages' Jekyll pass from dropping `_`-prefixed files.
      - name: SPA shell + fallback
        working-directory: apps/web/.output/public
        run: |
          cp _shell.html index.html
          cp _shell.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
